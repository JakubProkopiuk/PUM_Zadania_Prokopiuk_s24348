[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.10"
name = "pum_zadania_prokopiuk"
readme = "README.md"
dynamic = [
    "version",
]
dependencies = [
    "ipython>=8.10",
    "jupyterlab>=3.0",
    "notebook",
    "kedro~=1.7.0",
]

[project.scripts]
pum-zadania-prokopiuk = "pum_zadania_prokopiuk.__main__:main"

[project.entry-points."kedro.hooks"]

[tool.setuptools.dynamic.version]
attr = "pum_zadania_prokopiuk.__version__"

[tool.setuptools.packages.find]
where = [
    "src",
]
namespaces = false

[tool.kedro]
package_name = "pum_zadania_prokopiuk"
project_name = "pum_zadania_prokopiuk"
kedro_init_version = "1.7.0"
tools = "['Data Structure']"
example_pipeline = "False"
source_dir = "src"
